}

async function startCheckout(btn, errEl) {
  setBusy(btn, true, "Abriendo pago…");
  if (errEl) showError(errEl, "");
  try {
    const { data, error } = await sb.functions.invoke("create-checkout", { method: "POST", body: { returnUrl: BASE_URL } });

      let msg = "No se pudo iniciar el pago. Intenta de nuevo.";
      try { msg = (await error.context.json()).error || msg; } catch { /* sin cuerpo */ }
      throw new Error(msg);
    }
    const url = new URL(data.url);
    if (!/(^|\.)mercadopago\.com(\.mx)?$|(^|\.)mercadolibre\.com(\.mx)?$/.test(url.hostname)) throw new Error("Respuesta de pago inválida.");
    location.href = url.href;
  } catch (e) {
    setBusy(btn, false);
    if (errEl) showError(errEl, e.message); else toast(e.message, 5000);
  }
}

const routes = {
  "/": (p, a) => viewProfile("posts", a),
  "/multimedia": (p, a) => viewProfile("media", a),
  "/galeria": () => go("#/"),
  "/registro": viewRegister,
  "/entrar": viewLogin,
  "/nueva-clave": viewNewPassword,
  "/cuenta": viewAccount,
  "/pago": viewPayment,
  "/admin": viewAdmin,
  "/legal/terminos": () => viewLegal("terminos"),
  "/legal/privacidad": () => viewLegal("privacidad"),
  "/legal/reembolsos": () => viewLegal("reembolsos"),
  "/legal/aviso-ia": () => viewLegal("aviso-ia"),
};
const PRIVATE = ["/cuenta", "/admin", "/nueva-clave"];
let renderToken = 0;
function currentRoute() {
  const h = location.hash.replace(/^#/, "") || "/";
  const [path, query = ""] = h.split("?");
  return { path, params: new URLSearchParams(query) };
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

async function render() {
  const token = ++renderToken;
  const { path, params } = currentRoute();
  renderChrome();
  const view = routes[path];
  if (!view) { app.innerHTML = notFound(); return; }
  if (PRIVATE.includes(path) && !state.user) return go(`#/entrar?next=${encodeURIComponent(path)}`);
  const keepScroll = (path === "/" || path === "/multimedia") && app.dataset.view === "profile";
  if (!keepScroll) { app.innerHTML = `<div class="loading"><div class="spinner"></div></div>`; window.scrollTo({ top: 0 }); }
  try {
    await view(params, () => token === renderToken);
  } catch (e) {
    console.error(e);
    if (token === renderToken) app.innerHTML = `<div class="page"><div class="alert alert-bad">Algo salió mal al cargar esta página. Recarga e intenta de nuevo.</div></div>`;
  }
}

let lbItems = [];
async function fetchPosts(from) {
  const { data, error } = await sb.from("posts")
    .select("id, caption, is_free, published_at, likes_count, post_media(id, storage_path, preview_path, kind, width, height, sort)")
    .order("published_at", { ascending: false }).range(from, from + PAGE_SIZE - 1);
  if (error) throw error;
  const posts = (data ?? []).map((p) => ({ ...p, post_media: [...p.post_media].sort((a, b) => a.sort - b.sort) }));
  const canSee = (p) => state.isAdmin || state.active || (p.is_free && !!state.user);
  const paths = posts.filter(canSee).flatMap((p) => p.post_media.map((m) => m.storage_path));
  const signed = {};
  if (paths.length) {
    const { data: s } = await sb.storage.from("content").createSignedUrls(paths, 3600);
    (s ?? []).forEach((d) => { if (d.signedUrl) signed[d.path] = d.signedUrl; });
  }
  let liked = new Set();
  if (state.user && posts.length) {
    const { data: l } = await sb.from("post_likes").select("post_id").in("post_id", posts.map((p) => p.id));
    liked = new Set((l ?? []).map((x) => x.post_id));
  }
  return { posts, signed, liked, canSee, more: posts.length === PAGE_SIZE };
}

const ratio = (m) => {
  const r = m?.width && m?.height ? m.width / m.height : 0.8;
  return Math.min(1.78, Math.max(0.8, r)).toFixed(3);
};
const countsHtml = (media) => {
  const im = media.filter((m) => m.kind === "image").length, vi = media.length - im;
  return `${im ? `<span>${ic("camera", "ic-xs")}${im}</span>` : ""}${vi ? `<span>${ic("video", "ic-xs")}${vi}</span>` : ""}`;
};

function renderPost(p, ctx) {
  const c = creator();
  const media = p.post_media;
  const unlocked = ctx.canSee(p) && media.every((m) => ctx.signed[m.storage_path]);
  let mediaHtml = "";
  if (media.length && unlocked) {
    const start = lbItems.length;
    media.forEach((m) => lbItems.push({ url: ctx.signed[m.storage_path], kind: m.kind }));
    mediaHtml = `
      <div class="post-media protected">
        ${p.is_free ? `<span class="free-tag">Gratis</span>` : ""}
        ${media.length > 1 ? `<span class="counter" data-counter>1/${media.length}</span>
          <button class="nav-arrow prev" data-dir="-1" aria-label="Anterior">${ic("left", "ic-sm")}</button>
          <button class="nav-arrow next" data-dir="1" aria-label="Siguiente">${ic("right", "ic-sm")}</button>` : ""}
        <div class="carousel" style="aspect-ratio:${ratio(media[0])}">
          ${media.map((m, i) => `<div class="slide" data-lb="${start + i}">
            ${m.kind === "video"
              ? `<video src="${esc(ctx.signed[m.storage_path])}#t=0.1" preload="metadata" muted playsinline></video><div class="play"><i>${PLAY}</i></div>`
              : `<img src="${esc(ctx.signed[m.storage_path])}" alt="" loading="lazy" draggable="false">`}</div>`).join("")}
        </div>
        ${media.length > 1 ? `<div class="dots">${media.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : ""}
      </div>`;
  } else if (media.length) {
    const needAccount = p.is_free && !state.user;
    mediaHtml = `
      <div class="post-media">
        ${p.is_free ? `<span class="free-tag">Gratis</span>` : ""}
        <div class="locked"><img src="${esc(publicUrl("previews", media[0].preview_path))}" alt="" loading="lazy">
          <div class="locked-over"><div>
            <div class="lock-badge">${ic("lock")}</div>
            <div class="locked-counts">${countsHtml(media)}</div><br>
            ${needAccount ? `<a class="btn btn-accent" href="#/registro">Crea una cuenta gratis para verla</a>`
              : `<button class="btn btn-accent" data-subscribe>Suscríbete para desbloquear</button>`}
          </div></div>
        </div>
      </div>`;
  }
  const liked = ctx.liked.has(p.id);
  return `
  <article class="post" data-post="${esc(p.id)}">
    <header class="post-head">
      ${avatarImg("avatar-sm")}
      <div class="post-who"><div class="n">${esc(c.name)} ${VERIFIED}</div><div class="h">${esc(CONFIG.handle)}</div></div>
      <time class="post-time" datetime="${esc(p.published_at)}" title="${esc(new Date(p.published_at).toLocaleString("es-MX"))}">${timeAgo(p.published_at)}</time>
    </header>
    ${p.caption ? `<p class="post-text">${esc(p.caption)}</p>` : ""}
    ${mediaHtml}
    <footer class="post-foot">
      <button class="act ${liked ? "liked" : ""}" data-like="${esc(p.id)}" aria-pressed="${liked}" aria-label="Me gusta">${ic("heart")}<span>${num(p.likes_count)}</span></button>
      <div class="post-meta">${countsHtml(media)}</div>
    </footer>
  </article>`;
}

function renderCells(posts, ctx) {
  return posts.flatMap((p) => {
    const ok = ctx.canSee(p);
    return p.post_media.map((m) => {
      const url = ctx.signed[m.storage_path];
      if (ok && url) {
        const i = lbItems.push({ url, kind: m.kind }) - 1;
        return `<div class="cell protected" data-lb="${i}">
          ${m.kind === "video" ? `<video src="${esc(url)}#t=0.1" preload="metadata" muted playsinline></video>` : `<img src="${esc(url)}" alt="" loading="lazy" draggable="false">`}
          ${m.kind === "video" ? `<span class="badge-ic">${ic("video", "ic-sm")}</span>` : ""}</div>`;
      }
      return `<div class="cell is-locked" ${p.is_free && !state.user ? `data-go="#/registro"` : "data-subscribe"}>
        <img src="${esc(publicUrl("previews", m.preview_path))}" alt="" loading="lazy">
        <div class="lock-mini">${ic("lock")}</div>
        ${m.kind === "video" ? `<span class="badge-ic">${ic("video", "ic-sm")}</span>` : ""}</div>`;
    });
  }).join("");
}

async function viewProfile(tab, alive) {
  const first = await fetchPosts(0);
  if (!alive()) return;
  lbItems = [];
  app.dataset.view = "profile";
  app.innerHTML = profileHeader(tab);

  const feed = $("#feed"), moreWrap = $("#more");
  let offset = 0;
  const append = (ctx) => {
    if (tab === "media") feed.insertAdjacentHTML("beforeend", renderCells(ctx.posts, ctx));
    else feed.insertAdjacentHTML("beforeend", ctx.posts.map((p) => renderPost(p, ctx)).join(""));
    offset += ctx.posts.length;
    moreWrap.classList.toggle("hidden", !ctx.more);
  };
  append(first);
  if (!first.posts.length) {
    feed.className = "";
    feed.innerHTML = `<div class="empty">${ic("image")}<p class="bold" style="color:var(--text)">Aún no hay publicaciones</p><p class="small">Vuelve pronto, ¡hay contenido nuevo cada semana!</p></div>`;
  }

  // Biografía expandible
  const bio = $("#bio"), bioMore = $("#bio-more");
  if (bio.scrollHeight > bio.clientHeight + 2) bioMore.classList.remove("hidden");
  bioMore.addEventListener("click", () => { bio.classList.toggle("clamp"); bioMore.textContent = bio.classList.contains("clamp") ? "Ver más" : "Ver menos"; });

  $("#share").addEventListener("click", async () => {
    const url = BASE_URL;
    try {
      if (navigator.share) await navigator.share({ title: creator().name, url });
      else { await navigator.clipboard.writeText(url); toast("Enlace copiado"); }
    } catch { /* cancelado */ }
  });

  $("#more button").addEventListener("click", async (e) => {
    const b = e.currentTarget; setBusy(b, true);
    try { append(await fetchPosts(offset)); } catch { toast("No se pudo cargar más"); }
    setBusy(b, false);
  });

  feed.addEventListener("click", onFeedClick);
  feed.addEventListener("contextmenu", (e) => { if (e.target.closest(".protected")) e.preventDefault(); });
  feed.addEventListener("scroll", onCarouselScroll, true);
}

function onFeedClick(e) {
  const like = e.target.closest("[data-like]");
  if (like) return toggleLike(like);
  const arrow = e.target.closest(".nav-arrow");
  if (arrow) {
    const car = arrow.parentElement.querySelector(".carousel");
    car.scrollBy({ left: car.clientWidth * Number(arrow.dataset.dir), behavior: "smooth" });
    return;
  }
  const goEl = e.target.closest("[data-go]");
  if (goEl) return go(goEl.dataset.go);
  const lb = e.target.closest("[data-lb]");
  if (lb) openLightbox(Number(lb.dataset.lb));
}
function onCarouselScroll(e) {
  const car = e.target;
  if (!car.classList?.contains("carousel")) return;
  const i = Math.round(car.scrollLeft / car.clientWidth);
  const wrap = car.parentElement;
  const n = car.children.length;
  const counter = wrap.querySelector("[data-counter]");
  if (counter) counter.textContent = `${i + 1}/${n}`;
  wrap.querySelectorAll(".dots i").forEach((d, k) => d.classList.toggle("on", k === i));
}

async function toggleLike(btn) {
  if (!state.user) { toast("Crea una cuenta para dar me gusta"); return go("#/registro"); }
  const id = btn.dataset.like;
  const was = btn.classList.contains("liked");
  const countEl = btn.querySelector("span");
  const n = Number(countEl.textContent.replace(/\D/g, "")) || 0;
  btn.classList.toggle("liked", !was);
  btn.setAttribute("aria-pressed", String(!was));
  countEl.textContent = num(Math.max(0, n + (was ? -1 : 1)));
  if (!was) { btn.classList.add("pop"); setTimeout(() => btn.classList.remove("pop"), 200); }
  const { error } = was
    ? await sb.from("post_likes").delete().eq("post_id", id).eq("user_id", state.user.id)
    : await sb.from("post_likes").insert({ post_id: id, user_id: state.user.id });
  if (error && error.code !== "23505") {
    btn.classList.toggle("liked", was); btn.setAttribute("aria-pressed", String(was)); countEl.textContent = num(n);
    toast("No se pudo guardar tu me gusta");
  }
}

function openLightbox(index) {
  let i = index;
  const box = document.createElement("div");
  box.className = "lightbox protected";
  box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true");
  const draw = () => {
    const it = lbItems[i];
    box.innerHTML = `
      <span class="lb-count">${i + 1} / ${lbItems.length}</span>
      <button class="lb-btn lb-close" aria-label="Cerrar">${ic("close")}</button>
      ${i > 0 ? `<button class="lb-btn lb-prev" aria-label="Anterior">${ic("left")}</button>` : ""}
      ${i < lbItems.length - 1 ? `<button class="lb-btn lb-next" aria-label="Siguiente">${ic("right")}</button>` : ""}
      <div class="stage">${it.kind === "video"
        ? `<video src="${esc(it.url)}" controls autoplay playsinline controlslist="nodownload noplaybackrate" disablepictureinpicture></video>`
        : `<img src="${esc(it.url)}" alt="" draggable="false">`}</div>`;
  };
  const move = (d) => { const n = i + d; if (n >= 0 && n < lbItems.length) { i = n; draw(); } };
  const close = () => { box.remove(); document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  const onKey = (e) => { if (e.key === "Escape") close(); if (e.key === "ArrowRight") move(1); if (e.key === "ArrowLeft") move(-1); };
  box.addEventListener("click", (e) => {
    if (e.target.closest(".lb-close") || e.target === box || e.target.classList.contains("stage")) return close();
    if (e.target.closest(".lb-prev")) return move(-1);
    if (e.target.closest(".lb-next")) return move(1);
  });
  let x0 = null;
  box.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  box.addEventListener("touchend", (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) move(dx < 0 ? 1 : -1); x0 = null; });
  box.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("keydown", onKey);
  document.body.style.overflow = "hidden";
  draw(); document.body.append(box);
}

const pwField = (id, label, auto) => `<div><label class="label" for="${id}">${label}</label>
  <div class="pw"><input class="input" id="${id}" name="${id}" type="password" minlength="8" required autocomplete="${auto}">

document.addEventListener("click", (e) => {

  if (state.user) return go("#/cuenta");

  app.innerHTML = authShell(`Únete a ${esc(creator().name)}`, "Crea tu cuenta gratis en segundos.", `

      <div><label class="label" for="username">Nombre de usuario</label>

      <div><label class="label" for="birthdate">Fecha de nacimiento</label>

      <label class="check"><input type="checkbox" name="terms" required>
        <span>Confirmo que soy mayor de 18 años y acepto los <a href="#/legal/terminos" style="color:var(--accent);font-weight:700">Términos</a> y el

  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();

  const pct = state.active ? Math.min(100, Math.round((daysLeft / CONFIG.periodDays) * 100)) : 0;
  const methodName = { credit_card: "Tarjeta de crédito", debit_card: "Tarjeta de débito", ticket: "OXXO / efectivo", account_money: "Saldo Mercado Pago", bank_transfer: "Transferencia" };

      <div class="grow"><h1 class="page-h">${esc(state.profile?.username ?? "")}</h1><p class="small mute">${esc(state.user.email)}</p></div>
    </div>
    <div class="grid-2">
      <div class="stack">
        <div class="card pad">
          <div class="row between"><h2 class="section-h">Suscripción</h2>
            ${state.active ? `<span class="pill pill-ok">● Activa</span>` : `<span class="pill pill-off">Inactiva</span>`}</div>

            <div class="grow"><div class="bold row" style="gap:.3rem">${esc(creator().name)} ${VERIFIED}</div><div class="xs mute">${mxn(CONFIG.priceMxn)} / ${CONFIG.periodDays} días</div></div></div>
          ${state.active ? `
            <div style="margin-top:1.2rem"><div class="row between small"><span class="mute">Días restantes</span><b>${daysLeft} de ${CONFIG.periodDays}</b></div>

              <p class="xs mute" style="margin-top:.5rem">Tu acceso termina el ${fdate(end)}. Si renuevas ahora, se suman ${CONFIG.periodDays} días.</p></div>
            <div class="row wrap-row" style="margin-top:1.2rem"><a class="btn btn-accent" href="#/">Ver contenido</a>
              <button class="btn btn-line" id="pay">Renovar · ${mxn(CONFIG.priceMxn)}</button></div>`
          : `

            <button class="sub-btn" id="pay" style="margin-top:1rem"><span>SUSCRIBIRSE</span><small>${mxn(CONFIG.priceMxn)} al mes</small></button>
            <p class="hint">Tarjeta de crédito, débito u OXXO con Mercado Pago. No se renueva automáticamente.</p>`}
          <div id="pay-err" style="margin-top:.8rem"></div>
        </div>
        <div class="card pad">
          <h2 class="section-h" style="margin-bottom:.6rem">Historial de pagos</h2>
          ${payments?.length ? `<div class="table-wrap"><table>
            <thead><tr><th>Fecha</th><th>Monto</th><th>Método</th><th>Estado</th></tr></thead>
            <tbody>${payments.map((p) => `<tr><td>${fdate(p.approved_at)}</td><td class="bold">${mxn(p.amount)}</td>
              <td>${esc(methodName[p.method] ?? p.method ?? "—")}</td>
              <td>${p.status === "approved" ? `<span class="pill pill-ok">Aprobado</span>` : `<span class="pill pill-off">Reembolsado</span>`}</td></tr>`).join("")}

            <div id="fu-err"></div>
            <button class="btn btn-line btn-block" type="submit">Guardar cambios</button>
          </form>
        </div>

    setBusy(btn, false);

  });
}

async function viewPayment(params, alive) {
  app.dataset.view = "auth";
  const st = params.get("estado");
  if (!state.user) {
    app.innerHTML = authShell("Inicia sesión", "Entra con tu cuenta para ver el estado de tu pago.", `<a class="btn btn-accent btn-block" href="#/entrar?next=/cuenta">Entrar</a>`);
    return;
  }
  if (st === "rechazado") {
    app.innerHTML = authShell("El pago no se completó", "No se hizo ningún cargo a tu cuenta.", `
      <div class="alert alert-bad">Mercado Pago rechazó el pago o lo cancelaste. Puedes intentar con otro método.</div>
      <a class="btn btn-accent btn-block" style="margin-top:1rem" href="#/cuenta">Intentar de nuevo</a>`);
    return;
  }
  if (st === "pendiente") {
    app.innerHTML = authShell("Pago pendiente", "Estamos esperando la confirmación.", `
      <div class="alert alert-warn">Si pagaste en OXXO o por transferencia, la acreditación puede tardar desde unos minutos hasta 48 horas. Tu acceso se activa solo cuando se apruebe.</div>
      <a class="btn btn-line btn-block" style="margin-top:1rem" href="#/cuenta">Ir a mi cuenta</a>`);
    return;
  }
  app.innerHTML = authShell("¡Gracias por tu pago!", "Estamos activando tu acceso…", `
    <div class="row" id="pstatus"><span class="spinner"></span><span class="small mute">Confirmando con Mercado Pago. Esto toma unos segundos.</span></div>`);
  const before = state.sub?.current_period_end;
  for (let i = 0; i < 20 && alive(); i++) {
    await loadSession();
    if (state.active && state.sub?.current_period_end !== before) break;
    await new Promise((r) => setTimeout(r, 3000));
  }
  if (!alive()) return;
  renderChrome();
  $("#pstatus").outerHTML = state.active
    ? `<div class="alert alert-ok">¡Listo! Tu suscripción está activa hasta el ${fdate(state.sub.current_period_end)}.</div>
       <a class="btn btn-accent btn-block" style="margin-top:1rem" href="#/">Ver el contenido</a>`
    : `<div class="alert alert-warn">Tu pago aún se está procesando. Revisa “Mi cuenta” en unos minutos; si en 1 hora no se activa, escríbenos a ${esc(CONFIG.supportEmail)}.</div>
       <a class="btn btn-line btn-block" style="margin-top:1rem" href="#/cuenta">Ir a mi cuenta</a>`;
}

    sb.from("subscriptions").select("user_id", { count: "exact", head: true }).gt("current_period_end", new Date().toISOString()),

function adminPublish() {
  $("#admin-body").innerHTML = `
    <div class="card pad">
      <form id="fp" class="stack">
        <div class="row" style="gap:.75rem;align-items:flex-start">${avatarImg("avatar-sm")}
          <textarea class="input grow" id="caption" maxlength="2000" placeholder="Escribe algo para tus suscriptores… (opcional)"></textarea></div>
        <label class="drop" id="drop"><input type="file" id="files" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" multiple class="sr">
          ${ic("upload")}<div class="bold" style="margin-top:.4rem">Toca o arrastra fotos y videos</div><div class="xs mute">JPG, PNG, WEBP, MP4, WEBM · hasta 100 MB cada uno · puedes elegir varios</div></label>
        <div class="thumbs" id="thumbs"></div>
        <div class="grid-2" style="grid-template-columns:1fr">
          <div><label class="label" for="when">Programar publicación</label><input class="input" id="when" type="datetime-local">
            <p class="hint">Déjalo vacío para publicar ahora.</p></div>
        </div>
        <label class="check"><input type="checkbox" id="free"><span><b>Publicación gratis</b> — la ven las personas registradas sin suscripción. Úsala como muestra para atraer suscriptores.</span></label>
        <div class="progress hidden" id="prog"><i></i></div>
        <div id="fp-err"></div>
        <button class="btn btn-accent btn-block" type="submit">Publicar</button>
      </form>
    </div>`;

  let selected = [];
  const input = $("#files"), drop = $("#drop"), thumbs = $("#thumbs");
  const show = () => {
    thumbs.innerHTML = selected.map((f, i) => `<div class="thumb">${f.type.startsWith("image/")
      ? `<img src="${URL.createObjectURL(f)}" alt="">` : `<div class="vid">${ic("video")}<br>${esc(f.name.slice(0, 14))}</div>`}
      <button type="button" class="x" data-rm="${i}" aria-label="Quitar">${ic("close", "ic-xs")}</button></div>`).join("");
  };
  const add = (list) => {
    for (const f of list) {
      if (!["image/jpeg", "image/png", "image/webp", "video/mp4", "video/webm"].includes(f.type)) { toast(`Formato no permitido: ${f.name}`); continue; }
      if (f.size > 100 * 1024 * 1024) { toast(`Archivo muy grande: ${f.name}`); continue; }
      selected.push(f);
    }
    show();
  };
  thumbs.addEventListener("click", (e) => { const b = e.target.closest("[data-rm]"); if (b) { selected.splice(+b.dataset.rm, 1); show(); } });
  input.addEventListener("change", () => { add(input.files); input.value = ""; });
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("drag"); add(e.dataTransfer.files); });

  $("#fp").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.currentTarget.querySelector("button[type=submit]"), err = $("#fp-err"), prog = $("#prog"), bar = prog.firstElementChild;
    if (!selected.length) return showError(err, "Agrega al menos una foto o video.");
    showError(err, ""); setBusy(btn, true, "Subiendo…"); prog.classList.remove("hidden");
    const postId = crypto.randomUUID();
    const uploaded = [];
    try {
      const when = $("#when").value;
      const { error: pErr } = await sb.from("posts").insert({
        id: postId, caption: $("#caption").value.trim() || null, is_free: $("#free").checked,
        published_at: when ? new Date(when).toISOString() : new Date().toISOString(),
      });
      if (pErr) throw pErr;
      for (let i = 0; i < selected.length; i++) {
        const file = selected[i];
        const kind = file.type.startsWith("video/") ? "video" : "image";
        const id = crypto.randomUUID();
        const ext = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "video/mp4": "mp4", "video/webm": "webm" }[file.type];
        const path = `${postId}/${id}.${ext}`, prevPath = `${postId}/${id}.jpg`;
        const { blob, width, height } = await makeBlurPreview(file, kind);
        const up1 = await sb.storage.from("content").upload(path, file, { contentType: file.type });
        if (up1.error) throw up1.error; uploaded.push(["content", path]);
        const up2 = await sb.storage.from("previews").upload(prevPath, blob, { contentType: "image/jpeg" });
        if (up2.error) throw up2.error; uploaded.push(["previews", prevPath]);
        const { error: mErr } = await sb.from("post_media").insert({ post_id: postId, storage_path: path, preview_path: prevPath, kind, width, height, sort: i });
        if (mErr) throw mErr;
        bar.style.width = `${Math.round(((i + 1) / selected.length) * 100)}%`;
      }
      await loadSite(); toast("¡Publicado!"); go("#/");
    } catch (ex) {
      console.error(ex);
      for (const b of ["content", "previews"]) {
        const paths = uploaded.filter(([bk]) => bk === b).map(([, p]) => p);
        if (paths.length) await sb.storage.from(b).remove(paths);
      }
      await sb.from("posts").delete().eq("id", postId);
      setBusy(btn, false); prog.classList.add("hidden");
      showError(err, "No se pudo publicar: " + (ex.message || "error desconocido"));
    }
  });
}

async function adminList(alive) {
  const { data: posts } = await sb.from("posts")
    .select("id, caption, is_free, published_at, likes_count, post_media(storage_path, preview_path, kind)")
    .order("published_at", { ascending: false }).limit(200);
  if (!alive()) return;
  $("#admin-body").innerHTML = `<div class="card pad">${(posts ?? []).map((p) => `
    <div class="admin-post">
      <div class="thumbs-row">${p.post_media.slice(0, 3).map((m) => `<img src="${esc(publicUrl("previews", m.preview_path))}" alt="">`).join("")}</div>
      <div class="grow">
        <div class="small bold" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.caption || "Sin descripción")}</div>
        <div class="xs mute">${fdate(p.published_at)} · ${p.post_media.length} archivo(s) · ${num(p.likes_count)} me gusta
          ${p.is_free ? ` · <b style="color:var(--accent)">Gratis</b>` : ""}${new Date(p.published_at) > new Date() ? ` · <b style="color:var(--warn)">Programada</b>` : ""}</div>
      </div>
      <button class="icon-btn" data-del="${esc(p.id)}" aria-label="Eliminar" style="color:var(--bad)">${ic("trash", "ic-sm")}</button>
    </div>`).join("") || `<div class="empty">${ic("image")}<p>Aún no hay publicaciones.</p></div>`}</div>`;
  $$("[data-del]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("¿Eliminar esta publicación y sus archivos? No se puede deshacer.")) return;
    const post = posts.find((p) => p.id === b.dataset.del);
    b.disabled = true;
    const c = post.post_media.map((m) => m.storage_path), pv = post.post_media.map((m) => m.preview_path);
    if (c.length) await sb.storage.from("content").remove(c);
    if (pv.length) await sb.storage.from("previews").remove(pv);
    const { error } = await sb.from("posts").delete().eq("id", post.id);
    if (error) { b.disabled = false; return toast("No se pudo eliminar"); }
    await loadSite(); toast("Publicación eliminada"); render();
  }));
}

/** Reduce una imagen (perfil/portada) a JPG. square=true recorta al centro. */
async function resizeImage(file, maxW, square) {
  const bmp = await createImageBitmap(file);
  let sx = 0, sy = 0, sw = bmp.width, sh = bmp.height;
  if (square) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; }
  const scale = Math.min(1, maxW / sw);
  const cv = document.createElement("canvas"); cv.width = Math.round(sw * scale); cv.height = Math.round(sh * scale);
  const ctx = cv.getContext("2d"); ctx.imageSmoothingQuality = "high";
  ctx.drawImage(bmp, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  return await new Promise((r) => cv.toBlob(r, "image/jpeg", 0.88));
}

/** Vista previa diminuta y difuminada (lo único público de cada foto/video). */
async function makeBlurPreview(file, kind) {
  let source, width, height;
  const url = URL.createObjectURL(file);
  try {
    if (kind === "image") { source = await createImageBitmap(file); width = source.width; height = source.height; }
    else {
      const v = document.createElement("video");
      v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
      await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error("No se pudo leer el video")); });
      v.currentTime = Math.min(1, (v.duration || 2) / 2);
      await new Promise((res) => { v.onseeked = res; });
      source = v; width = v.videoWidth; height = v.videoHeight;
    }
    const sw = 24, sh = Math.max(1, Math.round((height / width) * sw));
    const small = document.createElement("canvas"); small.width = sw; small.height = sh;
    small.getContext("2d").drawImage(source, 0, 0, sw, sh);
    const W = 480, H = Math.round((height / width) * W);
    const big = document.createElement("canvas"); big.width = W; big.height = H;
    const ctx = big.getContext("2d"); ctx.filter = "blur(14px)";
    ctx.drawImage(small, -20, -20, W + 40, H + 40);
    const blob = await new Promise((r) => big.toBlob(r, "image/jpeg", 0.7));
    return { blob, width, height };
  } finally { URL.revokeObjectURL(url); }
}

function viewLegal(key) {
  app.dataset.view = "legal";
  const [title, html] = LEGAL[key];
  app.innerHTML = `<div class="page legal"><h1 class="page-h">${title}</h1><p class="xs mute" style="margin-top:.3rem">Última actualización: 24 de noviembre de 2026</p>${html()}</div>`;
}
const notFound = () => `<div class="empty"><p class="page-h" style="color:var(--text)">404</p><p>Esta página no existe.</p><a class="btn btn-line" style="margin-top:1rem" href="#/">Volver al inicio</a></div>`;

// ═══════════════ Arranque ═══════════════
function initGate() {
  const gate = $("#gate");
  let ok = false;
  try { ok = localStorage.getItem("age_ok_v1") === "1"; } catch { /* sin almacenamiento */ }
  if (!ok) { gate.classList.remove("hidden"); document.body.style.overflow = "hidden"; }
  $("#gate-ok").addEventListener("click", () => {
    try { localStorage.setItem("age_ok_v1", "1"); } catch { /* sin almacenamiento */ }
    gate.classList.add("hidden"); document.body.style.overflow = "";
  });
}

async function boot() {
  initGate();
  const q = new URLSearchParams(location.search);
  const pago = q.get("pago");
  let recovery = false, booted = false;
  sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") { recovery = true; if (booted) go("#/nueva-clave"); }
    if (event === "SIGNED_OUT" && booted) loadSession().then(render);
  });
  await Promise.all([loadSession(), loadSite()]);
  let target = location.hash || "#/";
  if (pago) target = `#/pago?estado=${encodeURIComponent(pago)}`;
  if (recovery) target = "#/nueva-clave";
  if (pago || recovery || location.search) history.replaceState(null, "", location.pathname + target);
  booted = true;
  window.addEventListener("hashchange", render);
  render();
}
boot();
</script>
