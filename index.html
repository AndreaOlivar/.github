const routes = {
  "/": viewHome,
  "/galeria": viewGallery,
  "/registro": viewRegister,
  "/entrar": viewLogin,
  "/nueva-clave": viewNewPassword,
  "/cuenta": viewAccount,
  "/pago": viewPayment,
  "/admin": viewAdmin,
  "/legal/terminos": () => viewLegal("terminos"),
  "/legal/privacidad": () => viewLegal("privacidad"),
  "/legal/reembolsos": () => viewLegal("reembolsos"),
  "/legal/aviso-ia": () => viewLegal("aviso-ia"),
};
const PRIVATE = ["/cuenta", "/admin"];
let renderToken = 0;

function currentRoute() {
  const h = location.hash.replace(/^#/, "") || "/";
  const [path, query = ""] = h.split("?");
  return { path, params: new URLSearchParams(query) };
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

async function render() {
  const token = ++renderToken;
  const { path, params } = currentRoute();
  const view = routes[path];
  if (!view) { app.innerHTML = viewNotFound(); return; }
  if (PRIVATE.includes(path) && !state.user) { go(`#/entrar?next=${encodeURIComponent(path)}`); return; }
  app.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
  window.scrollTo({ top: 0 });
  try {
    await view(params, () => token === renderToken);
  } catch (e) {
    console.error(e);
    if (token === renderToken) app.innerHTML = `<div class="wrap narrow section"><div class="alert alert-bad">Algo salió mal al cargar esta página. Recarga e intenta de nuevo.</div></div>`;
  }
}

async function viewGallery(_p, alive) {
  const { data: posts, error } = await sb.from("posts")
    .select("id, caption, is_free, published_at, post_media(id, storage_path, preview_path, kind, sort)")
    .order("published_at", { ascending: false }).limit(60);
  if (error) throw error;
  if (!alive()) return;

  const canSee = (p) => state.isAdmin || state.active || (p.is_free && state.user);
  const visiblePaths = (posts ?? []).filter(canSee).flatMap((p) => p.post_media.map((m) => m.storage_path));

  // URLs firmadas que expiran en 10 minutos. Supabase solo las firma si RLS lo permite.
  const signed = {};
  if (visiblePaths.length) {
    const { data } = await sb.storage.from("content").createSignedUrls(visiblePaths, 600);
    (data ?? []).forEach((d) => { if (d.signedUrl) signed[d.path] = d.signedUrl; });
  }
  if (!alive()) return;

  const wm = esc(`${state.profile?.username ?? ""} · ${CONFIG.handle}`);
  const watermark = `<div class="watermark">${Array.from({ length: 18 }, () => `<span>${wm}</span>`).join("")}</div>`;

  const paywall = state.active || state.isAdmin ? "" : `
    <div class="card paywall">
      <div class="lock">${LOCK}</div>
      <h2 class="display" style="font-size:1.6rem">Desbloquea todo el contenido</h2>
      <p class="muted">Suscríbete por ${mxn(CONFIG.priceMxn)} al mes y ve todas las fotos y videos sin difuminar.</p>
      <a class="btn btn-primary" href="${state.user ? "#/cuenta" : "#/registro"}">${state.user ? "Suscribirme" : "Crear cuenta y suscribirme"}</a>
    </div>`;

  const items = [];
  const postsHtml = (posts ?? []).map((p) => {
    const media = [...p.post_media].sort((a, b) => a.sort - b.sort);
    const tiles = media.map((m) => {
      const url = signed[m.storage_path];
      if (url) {
        const idx = items.push({ url, kind: m.kind }) - 1;
        return `<div class="tile protected" data-open="${idx}">
          ${m.kind === "video"
            ? `<video src="${esc(url)}" preload="metadata" muted playsinline></video><span class="kind">▶ Video</span>`
            : `<img src="${esc(url)}" alt="" loading="lazy" draggable="false">`}
          ${p.is_free ? `<span class="free">Gratis</span>` : ""}${watermark}</div>`;
      }
      return `<a class="tile locked" href="${state.user ? "#/cuenta" : "#/registro"}">
        <img src="${esc(previewUrl(m.preview_path))}" alt="" loading="lazy">
        <span class="kind">${m.kind === "video" ? "▶ Video" : "Foto"}</span>
        ${p.is_free ? `<span class="free">Gratis</span>` : ""}
        <div class="over"><div><div class="lock">${LOCK}</div>${p.is_free ? "Crea una cuenta gratis para verla" : "Solo suscriptores"}</div></div></a>`;
    }).join("");
    return `<article class="post">
      <div class="post-head"><span class="muted small">${fdate(p.published_at)}</span><span class="muted xs">${media.length} archivo${media.length === 1 ? "" : "s"}</span></div>
      ${p.caption ? `<p class="post-caption">${esc(p.caption)}</p>` : ""}
      <div class="grid">${tiles}</div></article>`;
  }).join("");

  app.innerHTML = `
  <section class="wrap section">
    <div class="post-head" style="margin-bottom:1.5rem">
      <div><h1 class="section-title" style="margin:0">Galería</h1><p class="muted small" style="margin:.2rem 0 0">${esc(CONFIG.handle)}</p></div>
      ${state.active ? `<span class="badge badge-ok">● Suscripción activa</span>` : ""}
    </div>
    ${paywall}
    ${postsHtml || `<div class="card pad center muted">Todavía no hay publicaciones. ¡Vuelve pronto!</div>`}
  </section>`;

  app.addEventListener("contextmenu", blockContext);
  $$("[data-open]", app).forEach((el) => el.addEventListener("click", () => openLightbox(items[+el.dataset.open], watermark)));
}
function blockContext(e) { if (e.target.closest(".protected, .lightbox")) e.preventDefault(); }

function openLightbox(item, watermark) {
  const box = document.createElement("div");
  box.className = "lightbox protected";
  box.innerHTML = `<button class="btn btn-ghost btn-sm close" aria-label="Cerrar">✕ Cerrar</button>
    <div class="media">${item.kind === "video"
      ? `<video src="${esc(item.url)}" controls autoplay playsinline controlslist="nodownload noplaybackrate" disablepictureinpicture></video>`
      : `<img src="${esc(item.url)}" alt="" draggable="false">`}${watermark}</div>`;
  const close = () => { box.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  box.addEventListener("click", (e) => { if (e.target === box || e.target.closest(".close")) close(); });
  box.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("keydown", onKey);
  document.body.append(box);
}

        <p class="hint">Mínimo 8 caracteres.</p></div>
      <div><label class="label" for="birthdate">Fecha de nacimiento</label>
        <input class="input" id="birthdate" name="birthdate" type="date" required max="${max.toISOString().slice(0, 10)}"></div>
      <label class="check"><input type="checkbox" name="terms" required>
        <span>Confirmo que soy mayor de 18 años y acepto los <a href="#/legal/terminos" style="color:var(--rose-2)">Términos</a> y el

      <div id="err"></div>
      <button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>

    </form>`);

  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.currentTarget, err = $("#err"), btn = f.querySelector("button[type=submit]");
    const d = Object.fromEntries(new FormData(f));
    if (!/^[A-Za-z0-9_]{3,20}$/.test(d.username)) return showError(err, "El nombre de usuario no es válido.");
    if (!/^\S+@\S+\.\S+$/.test(d.email)) return showError(err, "Escribe un correo válido.");
    if ((d.password || "").length < 8) return showError(err, "La contraseña debe tener al menos 8 caracteres.");
    if (!d.birthdate || new Date(d.birthdate) > max) return showError(err, "Debes ser mayor de 18 años para registrarte.");
    if (!d.terms) return showError(err, "Debes aceptar los términos.");
    showError(err, ""); setBusy(btn, true, "Creando cuenta…");
    const { data, error } = await sb.auth.signUp({
      email: d.email.trim(), password: d.password,
      options: { emailRedirectTo: BASE_URL, data: { username: d.username, birthdate: d.birthdate, accepted_terms: true } },
    });
    setBusy(btn, false);
    if (error) return showError(err, authErrorMsg(error));
    if (data.session) { await loadSession(); toast("¡Cuenta creada!"); return go("#/cuenta"); }
    // Si en Supabase sigue activa la confirmación por correo, no hay sesión todavía.
    showError(err, "Tu cuenta se creó, pero el servidor pide confirmación por correo. Intenta iniciar sesión en unos minutos.");
  });
}

async function startCheckout(btn, errEl) {
  setBusy(btn, true, "Abriendo Mercado Pago…");
  showError(errEl, "");
  try {
    const { data, error } = await sb.functions.invoke("create-checkout", { method: "POST", body: { returnUrl: BASE_URL } });
    if (error) {
      let msg = "No se pudo iniciar el pago. Intenta de nuevo.";
      try { msg = (await error.context.json()).error || msg; } catch { /* sin cuerpo */ }
      throw new Error(msg);
    }
    const url = new URL(data.url);
    if (!/(^|\.)mercadopago\.com(\.mx)?$|(^|\.)mercadolibre\.com(\.mx)?$/.test(url.hostname)) throw new Error("Respuesta de pago inválida.");
    location.href = url.href;
  } catch (e) {
    setBusy(btn, false);
    showError(errEl, e.message);
  }
}

    setBusy(btn, false);
    if (error) return showError(err, error.code === "23505" ? "Ese nombre ya está ocupado." : "No se pudo guardar.");
    showError(err, ""); toast("Perfil actualizado"); await loadSession();
  });
}

async function viewPayment(params, alive) {
  const st = params.get("estado");
  if (!state.user) {
    app.innerHTML = authShell("Inicia sesión", "Entra con tu cuenta para ver el estado de tu pago.", `<a class="btn btn-primary btn-block" href="#/entrar?next=/cuenta">Entrar</a>`);
    return;
  }
  if (st === "rechazado") {
    app.innerHTML = authShell("El pago no se completó", "No se hizo ningún cargo.", `
      <div class="alert alert-bad">Mercado Pago rechazó el pago o lo cancelaste. Puedes intentar con otro método.</div>
      <a class="btn btn-primary btn-block" style="margin-top:1rem" href="#/cuenta">Intentar de nuevo</a>`);
    return;
  }
  if (st === "pendiente") {
    app.innerHTML = authShell("Pago pendiente", "Estamos esperando la confirmación.", `
      <div class="alert alert-warn">Si pagaste en OXXO o por transferencia, la acreditación puede tardar desde unos minutos hasta 48 horas. Tu acceso se activa solo cuando se apruebe.</div>
      <a class="btn btn-ghost btn-block" style="margin-top:1rem" href="#/cuenta">Ir a mi cuenta</a>`);
    return;
  }
  app.innerHTML = authShell("¡Gracias por tu pago!", "Estamos activando tu acceso…", `
    <div class="row" id="pstatus"><span class="spinner"></span><span class="muted small">Confirmando con Mercado Pago. Esto toma unos segundos.</span></div>`);
  const before = state.sub?.current_period_end;
  for (let i = 0; i < 20 && alive(); i++) {
    await loadSession();
    if (state.active && state.sub?.current_period_end !== before) break;
    await new Promise((r) => setTimeout(r, 3000));
  }
  if (!alive()) return;
  $("#pstatus").outerHTML = state.active
    ? `<div class="alert alert-ok">Tu suscripción está activa hasta el ${fdate(state.sub.current_period_end)}.</div>
       <a class="btn btn-primary btn-block" style="margin-top:1rem" href="#/galeria">Ver el contenido</a>`
    : `<div class="alert alert-warn">Tu pago aún se está procesando. Revisa “Mi cuenta” en unos minutos; si en 1 hora no se activa, escríbenos a ${esc(CONFIG.supportEmail)}.</div>
       <a class="btn btn-ghost btn-block" style="margin-top:1rem" href="#/cuenta">Ir a mi cuenta</a>`;
}

// ─── Admin ─────────────────────────────────────────────────────────────
async function viewAdmin(_p, alive) {
  await loadSession();
  if (!state.isAdmin) { app.innerHTML = viewNotFound(); return; }
  const [{ data: posts }, { count: subs }, { data: stats }] = await Promise.all([
    sb.from("posts").select("id, caption, is_free, published_at, post_media(id, storage_path, preview_path, kind)").order("published_at", { ascending: false }).limit(100),
    sb.from("subscriptions").select("user_id", { count: "exact", head: true }).gt("current_period_end", new Date().toISOString()),
    sb.rpc("public_stats"),
  ]);
  if (!alive()) return;

  app.innerHTML = `
  <section class="wrap section">
    <h1 class="section-title">Panel de administración</h1>
    <div class="stats" style="margin:0 0 2rem"><div><b>${stats?.posts ?? 0}</b><span>Publicaciones</span></div>
      <div><b>${stats?.photos ?? 0}</b><span>Fotos</span></div><div><b>${stats?.videos ?? 0}</b><span>Videos</span></div></div>
    <div class="tabs-grid">
      <div class="card pad">
        <h2 style="font-size:1.15rem;margin-bottom:1rem">Nueva publicación</h2>
        <form id="fp" class="stack">
          <label class="drop" id="drop"><input type="file" id="files" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" multiple class="sr">
            <b style="color:#fff">Toca o arrastra fotos / videos aquí</b><br><span class="muted small">JPG, PNG, WEBP, MP4, WEBM · máx. 100 MB c/u</span></label>
          <div class="thumbs" id="thumbs"></div>
          <div><label class="label" for="caption">Descripción (opcional)</label><textarea class="input" id="caption" maxlength="2000"></textarea></div>
          <div><label class="label" for="when">Fecha de publicación</label><input class="input" id="when" type="datetime-local">
            <p class="hint">Déjalo vacío para publicar ahora. Si pones una fecha futura, se publica sola en ese momento.</p></div>
          <label class="check"><input type="checkbox" id="free"><span>Publicación gratis (la ven usuarios registrados sin suscripción). Úsalo como “muestra”.</span></label>
          <div class="progress hidden" id="prog"><i></i></div>
          <div id="fp-err"></div>
          <button class="btn btn-primary btn-block" type="submit">Publicar</button>
        </form>
      </div>
      <div class="card pad">
        <h2 style="font-size:1.15rem;margin-bottom:.4rem">Resumen</h2>
        <p class="muted small">Suscriptores activos: <b style="color:#fff">${subs ?? "—"}</b> · Ingreso mensual estimado: <b style="color:#fff">${mxn((subs ?? 0) * CONFIG.priceMxn)}</b></p>
        <p class="muted small">Las imágenes de vista previa se generan difuminadas automáticamente al subir. El archivo original queda en un almacenamiento privado al que solo acceden suscriptores.</p>
        <div class="alert alert-warn small">Recuerda: todo el contenido debe mostrar a la modelo claramente como adulta y no debe parecerse a ninguna persona real.</div>
      </div>
    </div>

    <h2 style="font-size:1.15rem;margin:2.5rem 0 1rem">Publicaciones</h2>
    <div class="stack" id="plist">${(posts ?? []).map((p) => `
      <div class="card pad row" style="align-items:flex-start">
        <div class="row" style="gap:6px">${p.post_media.slice(0, 4).map((m) => `<img src="${esc(previewUrl(m.preview_path))}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:8px">`).join("")}</div>
        <div class="grow" style="min-width:180px">
          <p style="margin:0;color:#fff">${esc(p.caption || "Sin descripción")}</p>
          <p class="muted xs" style="margin:.2rem 0 0">${fdate(p.published_at)} · ${p.post_media.length} archivo(s) ${p.is_free ? "· <b style='color:var(--rose-2)'>Gratis</b>" : ""} ${new Date(p.published_at) > new Date() ? "· <b style='color:var(--gold)'>Programada</b>" : ""}</p>
        </div>
        <button class="btn btn-danger btn-sm" data-del="${esc(p.id)}">Eliminar</button>
      </div>`).join("") || `<p class="muted">Aún no hay publicaciones.</p>`}
    </div>
  </section>`;

  let selected = [];
  const input = $("#files"), drop = $("#drop"), thumbs = $("#thumbs");
  const showThumbs = () => {
    thumbs.innerHTML = selected.map((f, i) => `<div>${f.type.startsWith("image/") ? `<img src="${URL.createObjectURL(f)}" alt="">` : `<span class="kind" style="position:absolute;inset:auto auto 6px 6px">▶ ${esc(f.name.slice(0, 12))}</span>`}</div>`).join("");
  };
  const addFiles = (list) => {
    for (const f of list) {
      if (!["image/jpeg", "image/png", "image/webp", "video/mp4", "video/webm"].includes(f.type)) { toast(`Formato no permitido: ${f.name}`); continue; }
      if (f.size > 100 * 1024 * 1024) { toast(`Archivo muy grande: ${f.name}`); continue; }
      selected.push(f);
    }
    showThumbs();
  };
  input.addEventListener("change", () => addFiles(input.files));
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("drag"); addFiles(e.dataTransfer.files); });

  $("#fp").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.currentTarget.querySelector("button[type=submit]"), err = $("#fp-err"), prog = $("#prog"), bar = prog.firstElementChild;
    if (!selected.length) return showError(err, "Agrega al menos un archivo.");
    showError(err, ""); setBusy(btn, true, "Subiendo…"); prog.classList.remove("hidden");
    const postId = crypto.randomUUID();
    const uploaded = [];
    try {
      const when = $("#when").value;
      const { error: pErr } = await sb.from("posts").insert({
        id: postId, caption: $("#caption").value.trim() || null, is_free: $("#free").checked,
        published_at: when ? new Date(when).toISOString() : new Date().toISOString(),
      });
      if (pErr) throw pErr;

      for (let i = 0; i < selected.length; i++) {
        const file = selected[i];
        const kind = file.type.startsWith("video/") ? "video" : "image";
        const id = crypto.randomUUID();
        const ext = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "video/mp4": "mp4", "video/webm": "webm" }[file.type];
        const path = `${postId}/${id}.${ext}`, prevPath = `${postId}/${id}.jpg`;
        const { blob: prevBlob, width, height } = await makeBlurPreview(file, kind);

        const up1 = await sb.storage.from("content").upload(path, file, { contentType: file.type, upsert: false });
        if (up1.error) throw up1.error;
        uploaded.push(["content", path]);
        const up2 = await sb.storage.from("previews").upload(prevPath, prevBlob, { contentType: "image/jpeg", upsert: false });
        if (up2.error) throw up2.error;
        uploaded.push(["previews", prevPath]);

        const { error: mErr } = await sb.from("post_media").insert({ post_id: postId, storage_path: path, preview_path: prevPath, kind, width, height, sort: i });
        if (mErr) throw mErr;
        bar.style.width = `${Math.round(((i + 1) / selected.length) * 100)}%`;
      }
      toast("¡Publicado!"); render();
    } catch (ex) {
      console.error(ex);
      // Deshace lo subido para no dejar archivos sueltos.
      for (const b of ["content", "previews"]) {
        const paths = uploaded.filter(([bk]) => bk === b).map(([, p]) => p);
        if (paths.length) await sb.storage.from(b).remove(paths);
      }
      await sb.from("posts").delete().eq("id", postId);
      setBusy(btn, false); prog.classList.add("hidden");
      showError(err, "No se pudo publicar: " + (ex.message || "error desconocido"));
    }
  });

  $$("[data-del]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("¿Eliminar esta publicación y sus archivos? No se puede deshacer.")) return;
    const post = posts.find((p) => p.id === b.dataset.del);
    setBusy(b, true);
    const c = post.post_media.map((m) => m.storage_path), pv = post.post_media.map((m) => m.preview_path);
    if (c.length) await sb.storage.from("content").remove(c);
    if (pv.length) await sb.storage.from("previews").remove(pv);
    const { error } = await sb.from("posts").delete().eq("id", post.id);
    if (error) { setBusy(b, false); return toast("No se pudo eliminar"); }
    toast("Publicación eliminada"); render();
  }));
}

/** Genera una vista previa pequeña y muy difuminada (lo único público). */
async function makeBlurPreview(file, kind) {
  let source, width, height;
  const url = URL.createObjectURL(file);
  try {
    if (kind === "image") {
      source = await createImageBitmap(file);
      width = source.width; height = source.height;
    } else {
      const v = document.createElement("video");
      v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
      await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error("No se pudo leer el video")); });
      v.currentTime = Math.min(1, (v.duration || 2) / 2);
      await new Promise((res) => { v.onseeked = res; });
      source = v; width = v.videoWidth; height = v.videoHeight;
    }
    // Paso 1: reducir a 24 px de ancho (destruye el detalle).
    const sw = 24, sh = Math.max(1, Math.round((height / width) * sw));
    const small = document.createElement("canvas"); small.width = sw; small.height = sh;
    small.getContext("2d").drawImage(source, 0, 0, sw, sh);
    // Paso 2: ampliar a 480 px con desenfoque.
    const W = 480, H = Math.round((height / width) * W);
    const big = document.createElement("canvas"); big.width = W; big.height = H;
    const ctx = big.getContext("2d");
    ctx.filter = "blur(14px)"; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(small, -20, -20, W + 40, H + 40);
    const blob = await new Promise((r) => big.toBlob(r, "image/jpeg", 0.7));
    return { blob, width, height };
  } finally {
    URL.revokeObjectURL(url);
  }
}

function initChrome() {
  $("#logo").innerHTML = `${esc(CONFIG.name)}<span>.</span>`;
  $("#foot-name").textContent = CONFIG.name;
  $("#foot-copy").textContent = `© ${new Date().getFullYear()} ${CONFIG.name}. Todos los derechos reservados.`;

  document.title = `${CONFIG.name} · Contenido exclusivo`;

  const gate = $("#gate");
  let ok = false;
  try { ok = localStorage.getItem("age_ok_v1") === "1"; } catch { /* sin almacenamiento */ }
  if (!ok) { gate.classList.remove("hidden"); document.body.style.overflow = "hidden"; $("#gate-ok").focus(); }
  $("#gate-ok").addEventListener("click", () => {
    try { localStorage.setItem("age_ok_v1", "1"); } catch { /* sin almacenamiento */ }

  });
}

async function boot() {
  initChrome();

  // Regreso desde Mercado Pago (?pago=...) → vista de pago, limpiando la URL.
  const q = new URLSearchParams(location.search);
  const pago = q.get("pago");
  let recovery = false, booted = false;
  sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") { recovery = true; if (booted) go("#/nueva-clave"); }
    if (event === "SIGNED_OUT" && booted) { loadSession().then(render); }
  });

  await loadSession(); // también procesa ?code= de confirmación o recuperación

  let target = location.hash || "#/";
  if (pago) target = `#/pago?estado=${encodeURIComponent(pago)}`;
  if (recovery) target = "#/nueva-clave";
  if (pago || recovery || q.has("code") || location.search) history.replaceState(null, "", location.pathname + target);
  if (q.has("code") && !recovery && state.user) toast("¡Correo confirmado! Ya puedes suscribirte.");

  booted = true;
  window.addEventListener("hashchange", render);
  render();
}

boot();
